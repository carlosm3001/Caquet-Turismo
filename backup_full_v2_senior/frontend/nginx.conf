server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy opcional si se quiere unificar en un solo puerto, 
    # pero el usuario pidió puertos específicos 80 y 8001 expuestos.
    # location /api/v1 {
    #     proxy_pass http://api-backend:8001;
    # }
}
