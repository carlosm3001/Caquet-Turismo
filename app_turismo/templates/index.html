<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turismo Caquetá</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #1b5e20; --secondary: #0d47a1; --accent: #ff9800; --bg: #f5f7fa; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); }
        header { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 25px 20px; text-align: center; }
        .search-container { max-width: 500px; margin: -20px auto 20px; background: white; padding: 10px 20px; border-radius: 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; align-items: center; }
        .search-container input { flex: 1; border: none; padding: 10px; font-size: 1.1rem; outline: none; }
        
        /* Estilos de los Filtros Rápidos */
        .filter-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; padding: 0 20px; flex-wrap: wrap; }
        .filter-chip { 
            padding: 8px 18px; background: white; border: 1.5px solid #ddd; border-radius: 20px; 
            cursor: pointer; font-size: 0.9rem; font-weight: bold; transition: all 0.2s; color: #555;
        }
        .filter-chip.active { background: var(--primary); color: white; border-color: var(--primary); }
        .filter-chip:hover:not(.active) { background: #eee; }

        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; padding: 0 20px 40px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: transform 0.2s; position: relative; }
        .card:hover { transform: translateY(-5px); }
        .card-img { height: 160px; background: #333; position: relative; background-size: cover; background-position: center; }
        .card-img i { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(255,255,255,0.2); font-size: 2.5rem; }
        .card-body { padding: 15px; }
        .card-title { font-size: 1.1rem; font-weight: bold; margin: 0; color: #333; }
        .card-cat { color: var(--primary); font-size: 0.7rem; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; display: block; }
        .card-info { color: #666; font-size: 0.85rem; margin-top: 8px; display: flex; gap: 15px; }
        .card-info i { color: #999; margin-right: 5px; }
        .badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); color: white; padding: 3px 10px; border-radius: 4px; font-size: 0.7rem; z-index: 10; }
        .clima-badge { position: absolute; top: 10px; right: 10px; background: var(--accent); color: white; padding: 3px 10px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; z-index: 10; }
        #loader { text-align: center; display: none; padding: 20px; color: var(--primary); }
    </style>
</head>
<body>

<header>
    <h1>TURISMO CAQUETÁ</h1>
    <p>Explora la Ventana Turística del Piedemonte</p>
</header>

<div class="search-container">
    <i class="fas fa-search" style="color: #999;"></i>
    <input type="text" id="searchInput" placeholder="Busca por municipio..." oninput="debounceSearch()">
</div>

<div class="filter-container">
    <div class="filter-chip active" onclick="setFilter('', this)">Ver Todo</div>
    <div class="filter-chip" onclick="setFilter('Cascada', this)"><i class="fas fa-water"></i> Cascadas</div>
    <div class="filter-chip" onclick="setFilter('Caminata', this)"><i class="fas fa-hiking"></i> Caminatas</div>
    <div class="filter-chip" onclick="setFilter('Alojamiento', this)"><i class="fas fa-hotel"></i> Hospedaje</div>
    <div class="filter-chip" onclick="setFilter('Extremo', this)"><i class="fas fa-bolt"></i> Deporte Extremo</div>
</div>

<div id="loader"><i class="fas fa-spinner fa-spin fa-2x"></i></div>
<div class="gallery" id="galeria"></div>

<script>
    let currentCategory = '';
    let searchTimer;
    let abortController = null;

    const IMAGENES = {
        'Cascada': 'https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=400&q=80',
        'Caminata': 'https://images.unsplash.com/photo-1551632432-c7d419d0a4fb?w=400&q=80',
        'Alojamiento': 'https://images.unsplash.com/photo-1566073771259-6a8506099945?w=400&q=80',
        'Default': 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=400&q=80'
    };

    function setFilter(cat, element) {
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        element.classList.add('active');
        currentCategory = cat;
        cargarDatos();
    }

    function debounceSearch() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(cargarDatos, 300);
    }

    async function cargarDatos() {
        const val = document.getElementById('searchInput').value;
        const galeria = document.getElementById('galeria');
        const loader = document.getElementById('loader');

        if (abortController) abortController.abort();
        abortController = new AbortController();

        loader.style.display = 'block';
        
        try {
            const url = `/actividades?municipio=${encodeURIComponent(val)}&categoria=${currentCategory}`;
            const res = await fetch(url, { signal: abortController.signal });
            const data = await res.json();
            
            loader.style.display = 'none';
            let htmlBuffer = "";

            data.forEach(item => {
                // Imagen por categoría
                let imgUrl = IMAGENES.Default;
                if(item.categoria.includes('Cascada')) imgUrl = IMAGENES.Cascada;
                else if(item.categoria.includes('Caminata')) imgUrl = IMAGENES.Caminata;
                else if(item.categoria.includes('Alojamiento')) imgUrl = IMAGENES.Alojamiento;

                // Icono por categoría
                let icono = 'fa-mountain';
                if(item.categoria.includes('Cascada')) icono = 'fa-water';
                else if(item.categoria.includes('Caminata')) icono = 'fa-hiking';
                else if(item.categoria.includes('Alojamiento')) icono = 'fa-bed';

                let climaIcono = item.clima.includes('Cálido') ? 'fa-sun' : 'fa-cloud-sun';

                htmlBuffer += `
                    <div class="card">
                        <span class="badge">${item.dificultad}</span>
                        <span class="clima-badge"><i class="fas ${climaIcono}"></i> ${item.clima}</span>
                        <div class="card-img" style="background-image: url('${imgUrl}')">
                            <i class="fas ${icono}"></i>
                        </div>
                        <div class="card-body">
                            <span class="card-cat">${item.categoria}</span>
                            <div class="card-title">${item.id.replace(/_/g, ' ')}</div>
                            <div class="card-info">
                                <span><i class="fas fa-map-marker-alt"></i> ${item.municipio}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            galeria.innerHTML = htmlBuffer || '<div style="grid-column: 1/-1; text-align: center;">No se encontraron resultados</div>';
        } catch (e) {
            if (e.name !== 'AbortError') {
                loader.style.display = 'none';
                console.error("Error cargando datos:", e);
            }
        }
    }

    cargarDatos();
</script>

</body>
</html>
