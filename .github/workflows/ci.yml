name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Variables de entorno para la configuración del backend
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Backend (FastAPI) ----------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 pytest

      - name: Lint backend (black)
        working-directory: ./backend
        run: |
          black --check .

      - name: Lint backend (flake8)
        working-directory: ./backend
        run: |
          flake8 .

      - name: Run backend tests
        working-directory: ./backend
        run: |
          pytest -q

      # ---------- Frontend (static SPA) ----------
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies (tailwindcss & autoprefixer)
        working-directory: ./frontend
        run: |
          npm install

      # ---------- Clean up ----------
      - name: Summary
        run: |
          echo "✅ Validación de calidad completada exitosamente. El código cumple con los estándares de estilo y pruebas."
