<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caquetá • Amazonía Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; scroll-behavior: smooth; }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .hero-gradient { background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1596394516093-501ba68a0ba6?auto=format&fit=crop&q=80&w=1920'); background-size: cover; background-position: center; }
        .card-hover:hover { transform: translateY(-10px); box-shadow: 0 30px 60px rgba(6, 78, 59, 0.15); }
        .animate-fade-in { animation: fadeIn 1s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#fafafa] text-slate-900 overflow-x-hidden">

<div id="loginOverlay" class="fixed inset-0 z-[5000] bg-emerald-950/90 backdrop-blur-xl flex items-center justify-center p-6 hidden">
    <div class="bg-white rounded-[3rem] p-12 w-full max-w-md shadow-2xl text-center relative overflow-hidden">
        <!-- Decoración -->
        <div class="absolute -top-10 -right-10 w-40 h-40 bg-emerald-50 rounded-full blur-3xl opacity-50"></div>
        
        <div id="authContent">
            <h2 id="authTitle" class="text-4xl font-black text-emerald-900 mb-2 tracking-tighter">Bienvenido</h2>
            <p id="authDesc" class="text-slate-400 mb-8 font-medium italic">Inicia sesión para explorar</p>
            
            <div class="space-y-4">
                <input type="text" id="regName" placeholder="Nombre Completo" class="w-full px-6 py-4 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-emerald-500 outline-none hidden">
                <input type="email" id="email" placeholder="Email" value="admin@gmail.com" class="w-full px-6 py-4 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-emerald-500 outline-none">
                <input type="password" id="pass" placeholder="Password" value="admin" class="w-full px-6 py-4 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-emerald-500 outline-none">
                
                <button id="authBtn" onclick="authAction()" class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl shadow-xl transition-all uppercase tracking-widest text-xs">INGRESAR</button>
                
                <div id="googleSection">
                    <div class="py-2 text-[10px] font-black text-slate-300 uppercase tracking-[0.2em]">O acceso rápido</div>
                    <button onclick="loginWithGoogle()" class="w-full py-4 bg-white border border-slate-200 text-slate-600 font-bold rounded-2xl flex items-center justify-center gap-3 hover:bg-slate-50 transition-all">
                        <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" class="w-5 h-5"> Google Login
                    </button>
                </div>

                <div class="pt-6 border-t border-slate-50">
                    <button id="toggleAuthMode" onclick="toggleAuthMode()" class="text-emerald-600 text-[10px] font-black uppercase tracking-widest hover:text-emerald-800 transition-colors">¿No tienes cuenta? Regístrate</button>
                </div>

                <button onclick="toggleLogin(false)" class="text-slate-300 text-[10px] font-bold uppercase tracking-widest mt-4 hover:text-red-400 transition-colors">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<nav class="fixed top-0 left-0 right-0 h-24 glass-nav z-[1000] px-10 flex items-center justify-between">
    <div class="flex items-center gap-3 cursor-pointer" onclick="showView('inicio')">
        <div class="w-12 h-12 bg-emerald-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-emerald-200"><i class="fas fa-leaf text-xl"></i></div>
        <span class="text-2xl font-black tracking-tighter text-emerald-950 uppercase">Caquetá <span class="text-emerald-500">Bio</span></span>
    </div>
    <div id="topNav" class="hidden md:flex items-center gap-10 font-bold text-[10px] text-slate-400 uppercase tracking-[0.25em]">
        <button onclick="showView('inicio')" class="hover:text-emerald-600 transition-colors">Inicio</button>
        <button onclick="showView('explorar')" class="hover:text-emerald-600 transition-colors">Destinos</button>
        <button onclick="showView('municipios')" class="hover:text-emerald-600 transition-colors">Estadísticas</button>
        <div id="adminLink" class="hidden"><button onclick="showView('gestion')" class="hover:text-emerald-600 transition-colors">Panel Admin</button></div>
    </div>
    <div class="flex items-center gap-4">
        <div id="userBtn" onclick="toggleLogin(true)" class="px-8 py-3 bg-emerald-600 text-white rounded-full text-[10px] font-black cursor-pointer hover:bg-emerald-700 transition-all shadow-xl shadow-emerald-100 uppercase tracking-widest">Acceder</div>
        <div id="userInfo" class="hidden flex items-center gap-4 bg-white/50 p-2 pr-6 rounded-full border border-slate-100 backdrop-blur-md">
            <div id="userAvatar" class="w-10 h-10 bg-emerald-600 rounded-full flex items-center justify-center text-white font-bold shadow-md shadow-emerald-100">?</div>
            <span id="userName" class="text-[10px] font-black text-emerald-900 uppercase tracking-widest"></span>
            <div onclick="logout()" class="text-slate-300 cursor-pointer hover:text-red-500 transition-all ml-2"><i class="fas fa-sign-out-alt"></i></div>
        </div>
    </div>
</nav>

<main id="mainContainer" class="pt-24 min-h-screen"></main>

<div id="chatWidget" class="fixed bottom-32 right-8 w-96 h-[550px] bg-white rounded-[3rem] shadow-2xl border border-slate-100 hidden flex-col overflow-hidden z-[4000]">
    <div class="p-8 bg-emerald-600 text-white flex justify-between items-center">
        <div><h4 class="font-black text-2xl tracking-tighter">Amazonia-IA</h4><p class="text-[10px] opacity-70 font-bold uppercase tracking-widest">Guía Semántico Experto</p></div>
        <button onclick="toggleChat()"><i class="fas fa-times"></i></button>
    </div>
    <div id="chatMsgs" class="flex-1 p-6 overflow-y-auto space-y-4 bg-slate-50/50">
        <div class="flex justify-start"><div class="bg-white p-5 rounded-[2rem] rounded-tl-none text-xs border border-slate-100 shadow-sm text-slate-500">¡Hola! ¿A qué paraíso del Caquetá viajamos hoy?</div></div>
    </div>
    <div class="p-6 bg-white border-t flex gap-3">
        <input type="text" id="chatIn" placeholder="Pregunta algo..." class="flex-1 px-5 py-4 bg-slate-100 rounded-2xl outline-none text-xs focus:ring-2 focus:ring-emerald-500">
        <button onclick="sendChat()" class="w-14 h-14 bg-emerald-600 text-white rounded-2xl shadow-lg flex items-center justify-center hover:scale-105 transition-all"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>
<button id="chatBtn" onclick="toggleChat()" class="fixed bottom-8 right-8 w-20 h-20 bg-emerald-950 text-white rounded-[2.5rem] shadow-2xl hidden items-center justify-center text-3xl z-[4000] hover:scale-110 transition-all border-4 border-emerald-400/20"><i class="fas fa-comment-dots text-emerald-400"></i></button>

<script>
    const API = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') 
        ? "http://localhost:8001/api/v1" 
        : window.location.origin + "/api/v1";
    let user = null;

    function toggleLogin(show) { document.getElementById('loginOverlay').classList.toggle('hidden', !show); }
    function logout() { localStorage.removeItem('access_token'); sessionStorage.clear(); window.location.href = "/"; }
    function loginWithGoogle() { window.location.href = `${API}/auth/google`; }

    // --- OPTIMIZACIÓN: WAKE UP & CACHE ---
    window.onload = () => {
        // Despertar motor de inmediato
        fetch(`${API}/status`).catch(() => {});
        
        const token = new URLSearchParams(window.location.search).get('token') || localStorage.getItem('access_token');
        if (token) {
            const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
            user = payload; user.token = token;
            localStorage.setItem('access_token', token);
            updateUI();
        }
        showView('inicio');
    };

    function updateUI() {
        if(!user) return;
        document.getElementById('userBtn').classList.add('hidden');
        document.getElementById('userInfo').classList.remove('hidden');
        document.getElementById('userName').innerText = user.name.split(' ')[0];
        document.getElementById('userAvatar').innerText = user.name.charAt(0);
        document.getElementById('chatBtn').style.display = 'flex';
        if(user.role==='admin') document.getElementById('adminLink').classList.remove('hidden');
    }

    async function fetchData(endpoint) {
        const cacheKey = `cache_${endpoint}`;
        const cached = sessionStorage.getItem(cacheKey);
        if (cached) return JSON.parse(cached);
        const res = await fetch(`${API}/${endpoint}`);
        const data = await res.json();
        sessionStorage.setItem(cacheKey, JSON.stringify(data));
        return data;
    }

    function toggleAuthMode() {
        const isLogin = document.getElementById('authTitle').innerText === 'Bienvenido';
        document.getElementById('authTitle').innerText = isLogin ? 'Crear Cuenta' : 'Bienvenido';
        document.getElementById('authDesc').innerText = isLogin ? 'Únete a nuestra comunidad' : 'Inicia sesión para explorar';
        document.getElementById('authBtn').innerText = isLogin ? 'REGISTRARME' : 'INGRESAR';
        document.getElementById('toggleAuthMode').innerText = isLogin ? '¿Ya tienes cuenta? Inicia sesión' : '¿No tienes cuenta? Regístrate';
        document.getElementById('regName').classList.toggle('hidden', !isLogin);
        document.getElementById('googleSection').classList.toggle('hidden', isLogin);
    }

    function toggleLogin(show) { document.getElementById('loginOverlay').classList.toggle('hidden', !show); }
    function logout() { localStorage.removeItem('access_token'); sessionStorage.clear(); window.location.href = "/"; }
    function loginWithGoogle() { window.location.href = `${API}/auth/google`; }

    async function authAction() {
        const isLogin = document.getElementById('authTitle').innerText === 'Bienvenido';
        const endpoint = isLogin ? 'login' : 'register';
        const body = { 
            email: document.getElementById('email').value, 
            password: document.getElementById('pass').value 
        };
        if (!isLogin) body.name = document.getElementById('regName').value;

        try {
            const res = await fetch(`${API}/${endpoint}`, { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify(body) 
            });
            const data = await res.json();
            if (res.ok) { 
                localStorage.setItem('access_token', data.token); 
                location.reload(); 
            } else {
                alert(data.detail || "Error en la autenticación");
            }
        } catch (e) {
            alert("Error de conexión con el servidor");
        }
    }

    async function showView(view) {
        const container = document.getElementById('mainContainer');
        if(view==='inicio') {
            container.innerHTML = `
                <section class="hero-gradient h-[75vh] flex items-center justify-center text-center px-6 relative">
                    <div class="animate-fade-in max-w-5xl z-10">
                        <span class="text-emerald-400 font-black text-[10px] tracking-[0.5em] uppercase mb-6 block bg-emerald-950/40 w-fit mx-auto px-6 py-2 rounded-full backdrop-blur-md border border-white/10">Amazonía Colombiana</span>
                        <h1 class="text-white text-7xl md:text-9xl font-black tracking-tighter leading-[0.85] mb-8 drop-shadow-2xl">CAQUETÁ <br/><span class="text-emerald-500 font-light italic text-shadow">ES VIDA</span></h1>
                        <p class="text-white/90 text-xl md:text-2xl font-light max-w-3xl mx-auto mb-12 leading-relaxed">El paraíso inexplorado donde las cascadas susurran historias milenarias.</p>
                        <button onclick="showView('explorar')" class="bg-emerald-500 hover:bg-emerald-400 text-white px-12 py-5 rounded-2xl font-black transition-all shadow-2xl hover:scale-105 uppercase tracking-widest text-[10px]">Explorar Destinos</button>
                    </div>
                </section>
                <section id="fauna" class="py-24 px-10 max-w-7xl mx-auto">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
                        <div class="card-hover group relative rounded-[3.5rem] overflow-hidden h-[500px] shadow-2xl transition-all border-4 border-white bg-slate-200">
                            <img src="https://images.unsplash.com/photo-1590420485404-f86d22b8ab18?auto=format&fit=crop&q=80&w=600" class="absolute inset-0 w-full h-full object-cover">
                            <div class="absolute inset-0 bg-gradient-to-t from-emerald-950/90 via-emerald-950/10 to-transparent p-12 flex flex-col justify-end text-white">
                                <h3 class="text-3xl font-black mb-2 tracking-tighter uppercase">Jaguar</h3>
                                <p class="text-white/50 text-xs font-light tracking-wide uppercase">El monarca de la selva</p>
                            </div>
                        </div>
                        <div class="card-hover group relative rounded-[3.5rem] overflow-hidden h-[500px] shadow-2xl transition-all border-4 border-white bg-slate-200">
                            <img src="https://images.unsplash.com/photo-1550853024-fae8cd4be47f?auto=format&fit=crop&q=80&w=600" class="absolute inset-0 w-full h-full object-cover">
                            <div class="absolute inset-0 bg-gradient-to-t from-emerald-950/90 via-emerald-950/10 to-transparent p-12 flex flex-col justify-end text-white">
                                <h3 class="text-3xl font-black mb-2 tracking-tighter uppercase">Guacamaya</h3>
                                <p class="text-white/50 text-xs font-light tracking-wide uppercase">Vuelo de colores libres</p>
                            </div>
                        </div>
                        <div class="card-hover group relative rounded-[3.5rem] overflow-hidden h-[500px] shadow-2xl transition-all border-4 border-white bg-slate-200">
                            <img src="https://images.pexels.com/photos/29026330/pexels-photo-29026330.jpeg?auto=compress&cs=tinysrgb&w=600" class="absolute inset-0 w-full h-full object-cover">
                            <div class="absolute inset-0 bg-gradient-to-t from-emerald-950/90 via-emerald-950/10 to-transparent p-12 flex flex-col justify-end text-white">
                                <h3 class="text-3xl font-black mb-2 tracking-tighter uppercase">Delfín</h3>
                                <p class="text-white/50 text-xs font-light tracking-wide uppercase">Magia en el río</p>
                            </div>
                        </div>
                    </div>
                </section>`;
        }
        else if(view==='explorar') {
            container.innerHTML = `<div class="flex flex-col items-center justify-center py-40 animate-pulse"><div class="animate-spin rounded-full h-16 w-16 border-t-4 border-emerald-600 mb-6"></div><p class="text-[10px] font-black text-emerald-950 uppercase tracking-[0.3em]">Conectando con la Amazonía...</p></div>`;
            try {
                const data = await fetchData('actividades');
                container.innerHTML = `
                    <div class="px-10 py-20 max-w-7xl mx-auto animate-fade-in">
                        <h2 class="text-5xl font-black text-emerald-950 tracking-tighter mb-16 italic">Ecosistema Turístico</h2>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-12">
                            ${data.map(d => {
                                const imgUrl = (!d.imagen || d.imagen === 'None' || d.imagen === '') ? 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&q=80&w=600' : d.imagen + '&w=600';
                                return `
                                <div onclick="requireAuth()" class="group bg-white rounded-[4rem] overflow-hidden shadow-2xl hover:-translate-y-4 transition-all cursor-pointer border border-slate-50 relative">
                                    <div class="h-80 bg-cover bg-center grayscale group-hover:grayscale-0 transition-all duration-1000" style="background-image: url('${imgUrl}')"></div>
                                    <div class="p-10">
                                        <p class="text-[9px] font-black text-emerald-600 uppercase tracking-widest mb-2">${d.categoria}</p>
                                        <h3 class="text-3xl font-black text-slate-800 tracking-tighter mb-4">${d.id}</h3>
                                        <div class="flex justify-between items-center text-[10px] font-bold text-slate-400 border-t border-slate-50 pt-8 mt-4">
                                            <span><i class="fas fa-map-marker-alt text-emerald-500 mr-2"></i> ${d.municipio}</span>
                                            <span><i class="fas fa-thermometer-half text-orange-400 mr-2"></i> ${d.clima.split(' ')[0]}</span>
                                        </div>
                                    </div>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>`;
            } catch(e) { container.innerHTML = `<div class="text-center py-40"><p class="text-emerald-950 font-black">Cerebro de datos fuera de línea. Por favor, recarga.</p></div>`; }
        }
        else if(view==='municipios') {
            if(!user) return requireAuth();
            container.innerHTML = `<div class="flex justify-center py-40"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-600"></div></div>`;
            const data = await fetchData('admin/dashboard');
            container.innerHTML = `
                <div class="px-10 py-24 max-w-7xl mx-auto animate-fade-in text-center">
                    <div class="bg-emerald-950 p-20 rounded-[5rem] text-white shadow-3xl inline-block w-full max-w-2xl relative overflow-hidden border-8 border-white/5">
                        <div class="absolute -right-20 -bottom-20 text-white/5 text-[20rem] font-black rotate-12"><i class="fas fa-server"></i></div>
                        <p class="text-xs font-bold text-emerald-400 uppercase tracking-[0.4em] mb-10">Ontología Semántica Activa</p>
                        <h4 class="text-9xl font-black tracking-tighter mb-4">${data.total_tripletas}</h4>
                        <p class="text-xl opacity-40 italic font-light">Tripletas OWL procesadas en tiempo real</p>
                    </div>
                </div>`;
        }
        else if(view==='gestion') {
            if(!user || user.role!=='admin') return requireAuth();
            container.innerHTML = `
                <div class="px-10 py-20 max-w-2xl mx-auto animate-fade-in">
                    <div class="bg-white p-16 rounded-[4rem] shadow-2xl space-y-10 border border-slate-50">
                        <h2 class="text-4xl font-black tracking-tighter text-emerald-900 mb-8 italic">Nueva Entrada RDF</h2>
                        <div class="space-y-4">
                            <label class="text-[9px] font-black text-slate-300 uppercase tracking-widest ml-4">Identificador del Recurso</label>
                            <input id="lName" placeholder="Nombre único" class="w-full p-6 bg-slate-50 rounded-3xl outline-none focus:ring-2 focus:ring-emerald-500 font-bold transition-all">
                        </div>
                        <div class="grid grid-cols-2 gap-6">
                            <select id="lMun" class="p-6 bg-slate-50 rounded-3xl outline-none font-bold text-slate-500"><option value="Florencia">Florencia</option><option value="Morelia">Morelia</option><option value="ElDoncello">El Doncello</option></select>
                            <select id="lCat" class="p-6 bg-slate-50 rounded-3xl outline-none font-bold text-slate-500"><option value="Cascada">Cascada</option><option value="Alojamiento">Alojamiento</option></select>
                        </div>
                        <input id="lImg" placeholder="Enlace de imagen Unsplash" class="w-full p-6 bg-slate-50 rounded-3xl outline-none">
                        <button onclick="saveLugar()" class="w-full py-7 bg-emerald-950 text-white font-black rounded-[2.5rem] shadow-2xl hover:scale-105 transition-all uppercase tracking-[0.2em] text-xs">Publicar en Ontología</button>
                    </div>
                </div>`;
        }
        window.scrollTo(0,0);
    }

    function requireAuth() { if(!user) { toggleLogin(true); } }
    
    async function saveLugar() {
        const body = { id: document.getElementById('lName').value, categoria: document.getElementById('lCat').value, municipio: document.getElementById('lMun').value, imagen: document.getElementById('lImg').value || "https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&q=80&w=600" };
        const res = await fetch(`${API}/actividades`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
        if(res.ok) { sessionStorage.clear(); alert("¡Sincronizado!"); showView('explorar'); }
    }

    function toggleChat() { if(!user) return requireAuth(); const w = document.getElementById('chatWidget'); w.classList.toggle('hidden'); w.classList.toggle('flex'); }
    async function sendChat() {
        const input = document.getElementById('chatIn'); if(!input.value) return;
        const msgs = document.getElementById('chatMsgs'); msgs.innerHTML += `<div class="flex justify-end animate-fade-in"><div class="bg-emerald-950 text-white p-5 rounded-[2.5rem] rounded-tr-none text-sm shadow-xl font-medium">${input.value}</div></div>`;
        const res = await fetch(`${API}/chat`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({message: input.value, email: user.email}) });
        const data = await res.json();
        input.value = ''; msgs.innerHTML += `<div class="flex justify-start animate-fade-in"><div class="bg-white p-5 rounded-[2.5rem] rounded-tl-none text-sm border border-slate-100 shadow-xl text-emerald-950 font-bold"><b>IA:</b> ${data.reply}</div></div>`;
        msgs.scrollTop = msgs.scrollHeight;
    }
</script>
</body>
</html>
