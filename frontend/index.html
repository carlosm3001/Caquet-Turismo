<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caquetá • Amazonía Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; scroll-behavior: smooth; }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .hero-gradient { background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1596394516093-501ba68a0ba6?auto=format&fit=crop&q=80&w=1920'); background-size: cover; background-position: center; }
        .card-hover:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .animate-fade-in { animation: fadeIn 1s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#fafafa] text-slate-900 overflow-x-hidden">

<!-- LOGIN OVERLAY -->
<div id="loginOverlay" class="fixed inset-0 z-[5000] bg-emerald-950/90 backdrop-blur-xl flex items-center justify-center p-6 hidden">
    <div class="bg-white rounded-[3rem] p-12 w-full max-w-md shadow-2xl text-center">
        <h2 class="text-4xl font-black text-emerald-900 mb-2 tracking-tighter">Bienvenido</h2>
        <p class="text-slate-400 mb-8 font-medium">Inicia sesión para desbloquear la experiencia completa</p>
        <div class="space-y-4">
            <input type="email" id="email" placeholder="Email" value="admin@gmail.com" class="w-full px-6 py-4 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-emerald-500 outline-none">
            <input type="password" id="pass" placeholder="Password" value="admin" class="w-full px-6 py-4 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-emerald-500 outline-none">
            <button onclick="auth('login')" class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl shadow-xl transition-all">INGRESAR</button>
            <div class="py-2 text-xs font-bold text-slate-300">O TAMBIÉN</div>
            <button onclick="loginWithGoogle()" class="w-full py-4 bg-white border border-slate-200 text-slate-600 font-bold rounded-2xl flex items-center justify-center gap-3"><img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" class="w-5 h-5"> Google</button>
            <button onclick="toggleLogin(false)" class="text-slate-400 text-xs font-bold uppercase tracking-widest mt-4">Cerrar</button>
        </div>
    </div>
</div>

<!-- NAVBAR -->
<nav class="fixed top-0 left-0 right-0 h-24 glass-nav z-[1000] px-10 flex items-center justify-between">
    <div class="flex items-center gap-2 cursor-pointer" onclick="showView('inicio')">
        <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center text-white"><i class="fas fa-leaf"></i></div>
        <span class="text-2xl font-black tracking-tighter text-emerald-950 uppercase">Caquetá <span class="text-emerald-500">Bio</span></span>
    </div>
    <div id="topNav" class="hidden md:flex items-center gap-8 font-bold text-sm text-slate-500 uppercase tracking-widest">
        <button onclick="showView('inicio')" class="hover:text-emerald-600 transition-colors">Inicio</button>
        <button onclick="showView('explorar')" class="hover:text-emerald-600 transition-colors">Explorar</button>
        <button onclick="showView('municipios')" class="hover:text-emerald-600 transition-colors">Estadísticas</button>
        <div id="adminLink" class="hidden"><button onclick="showView('gestion')" class="hover:text-emerald-600 transition-colors">Administrar</button></div>
    </div>
    <div class="flex items-center gap-4">
        <div id="userBtn" onclick="toggleLogin(true)" class="px-6 py-3 bg-emerald-600 text-white rounded-full text-xs font-black cursor-pointer hover:bg-emerald-700 transition-all shadow-lg shadow-emerald-100 uppercase tracking-widest">Iniciar Sesión</div>
        <div id="userInfo" class="hidden flex items-center gap-3">
            <span id="userName" class="text-xs font-bold text-slate-600"></span>
            <div onclick="logout()" class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center text-slate-400 cursor-pointer hover:bg-red-50 hover:text-red-400 transition-all"><i class="fas fa-power-off"></i></div>
        </div>
    </div>
</nav>

<!-- MAIN CONTENT -->
<main id="mainContainer" class="pt-24 min-h-screen"></main>

<!-- CHAT IA -->
<div id="chatWidget" class="fixed bottom-32 right-8 w-96 h-[550px] bg-white rounded-[3rem] shadow-2xl border border-slate-100 hidden flex-col overflow-hidden z-[4000]">
    <div class="p-8 bg-emerald-600 text-white">
        <h4 class="font-black text-xl tracking-tighter">Amazonia-IA</h4>
        <p class="text-[10px] opacity-70 font-bold uppercase tracking-widest">Guía Semántico Experto</p>
    </div>
    <div id="chatMsgs" class="flex-1 p-6 overflow-y-auto space-y-4 bg-slate-50/50"></div>
    <div class="p-6 bg-white border-t flex gap-3">
        <input type="text" id="chatIn" placeholder="¿Dónde quieres ir hoy?" class="flex-1 px-4 py-4 bg-slate-100 rounded-2xl outline-none text-sm">
        <button onclick="sendChat()" class="w-14 h-14 bg-emerald-600 text-white rounded-2xl shadow-lg flex items-center justify-center"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>
<button id="chatBtn" onclick="toggleChat()" class="fixed bottom-8 right-8 w-20 h-20 bg-emerald-950 text-white rounded-3xl shadow-2xl hidden items-center justify-center text-3xl z-[4000] hover:scale-110 transition-all"><i class="fas fa-comment-dots text-emerald-400"></i></button>

<script>
    const API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? "http://localhost:8001/api/v1" : "/api/v1";
    let user = null;

    window.onload = () => {
        const token = new URLSearchParams(window.location.search).get('token') || localStorage.getItem('access_token');
        if (token) {
            const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
            user = payload; user.token = token;
            localStorage.setItem('access_token', token);
            updateUI();
        }
        showView('inicio');
    };

    function updateUI() {
        if(!user) return;
        document.getElementById('userBtn').classList.add('hidden');
        document.getElementById('userInfo').classList.remove('hidden');
        document.getElementById('userName').innerText = user.name;
        document.getElementById('chatBtn').style.display = 'flex';
        if(user.role==='admin') document.getElementById('adminLink').classList.remove('hidden');
    }

    function toggleLogin(show) { document.getElementById('loginOverlay').classList.toggle('hidden', !show); }
    function logout() { localStorage.removeItem('access_token'); window.location.href = "/"; }
    function loginWithGoogle() { window.location.href = `${API}/auth/google`; }

    async function auth(type) {
        const body = { email: document.getElementById('email').value, password: document.getElementById('pass').value };
        const res = await fetch(`${API}/${type}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
        if(res.ok) { const data = await res.json(); localStorage.setItem('access_token', data.token); location.reload(); }
    }

    async function showView(view) {
        const container = document.getElementById('mainContainer');
        if(view==='inicio') {
            container.innerHTML = `
                <section class="hero-gradient h-[70vh] flex items-center justify-center text-center px-6">
                    <div class="animate-fade-in max-w-4xl">
                        <span class="text-emerald-400 font-black text-xs tracking-[0.3em] uppercase mb-4 block">Tesoro Escondido de Colombia</span>
                        <h1 class="text-white text-6xl md:text-8xl font-black tracking-tighter leading-none mb-6">EL CAQUETÁ <br/>TE ESPERA</h1>
                        <p class="text-white/80 text-xl font-light max-w-2xl mx-auto mb-10 leading-relaxed">Explora la puerta de oro de la Amazonía. Un ecosistema único de cascadas, selva y biodiversidad infinita.</p>
                        <div class="flex gap-4 justify-center">
                            <button onclick="showView('explorar')" class="bg-emerald-500 hover:bg-emerald-400 text-white px-10 py-5 rounded-2xl font-black transition-all shadow-2xl">DESCUBRIR DESTINOS</button>
                            <button onclick="document.getElementById('fauna').scrollIntoView()" class="bg-white/10 backdrop-blur hover:bg-white/20 text-white px-10 py-5 rounded-2xl font-black transition-all">CONOCER FAUNA</button>
                        </div>
                    </div>
                </section>
                
                <section id="fauna" class="py-24 px-10 max-w-7xl mx-auto">
                    <div class="flex justify-between items-end mb-16">
                        <div>
                            <h2 class="text-4xl font-black text-emerald-950 tracking-tighter">Sinfonía Amazónica</h2>
                            <p class="text-slate-400 font-medium uppercase tracking-widest text-[10px] mt-2">Nuestra Biodiversidad</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                        <div class="card-hover group relative rounded-[3rem] overflow-hidden h-[500px] shadow-2xl transition-all">
                            <img src="https://images.unsplash.com/photo-1541033073546-210df2155709?auto=format&fit=crop&q=80&w=800" class="absolute inset-0 w-full h-full object-cover">
                            <div class="absolute inset-0 bg-gradient-to-t from-emerald-950 via-transparent p-10 flex flex-col justify-end">
                                <h3 class="text-white text-3xl font-black mb-2">El Jaguar</h3>
                                <p class="text-white/60 text-sm leading-relaxed">El guardián de la selva. Símbolo de poder y misticismo en el corazón del Caquetá.</p>
                            </div>
                        </div>
                        <div class="card-hover group relative rounded-[3rem] overflow-hidden h-[500px] shadow-2xl transition-all">
                            <img src="https://images.unsplash.com/photo-1552728089-57bdde30ec3d?auto=format&fit=crop&q=80&w=800" class="absolute inset-0 w-full h-full object-cover">
                            <div class="absolute inset-0 bg-gradient-to-t from-emerald-950 via-transparent p-10 flex flex-col justify-end">
                                <h3 class="text-white text-3xl font-black mb-2">Guacamayas</h3>
                                <p class="text-white/60 text-sm leading-relaxed">Colores vibrantes que cruzan el cielo de Florencia y San Vicente del Caguán.</p>
                            </div>
                        </div>
                        <div class="card-hover group relative rounded-[3rem] overflow-hidden h-[500px] shadow-2xl transition-all">
                            <img src="https://images.unsplash.com/photo-1581404172403-92f7c00e6205?auto=format&fit=crop&q=80&w=800" class="absolute inset-0 w-full h-full object-cover">
                            <div class="absolute inset-0 bg-gradient-to-t from-emerald-950 via-transparent p-10 flex flex-col justify-end">
                                <h3 class="text-white text-3xl font-black mb-2">Delfín Rosado</h3>
                                <p class="text-white/60 text-sm leading-relaxed">Leyenda viva de nuestros ríos. Un encuentro espiritual en las aguas amazónicas.</p>
                            </div>
                        </div>
                    </div>
                </section>`;
        }
        else if(view==='explorar') {
            const res = await fetch(`${API}/actividades`);
            const data = await res.json();
            container.innerHTML = `
                <div class="px-10 py-16 max-w-7xl mx-auto">
                    <h2 class="text-5xl font-black text-emerald-950 tracking-tighter mb-12 italic">Catálogo de Maravillas</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
                        ${data.map(d => `
                        <div onclick="requireAuth()" class="group bg-white rounded-[3rem] overflow-hidden shadow-xl hover:-translate-y-4 transition-all cursor-pointer">
                            <div class="h-64 bg-cover bg-center grayscale group-hover:grayscale-0 transition-all duration-700" style="background-image: url('${d.imagen}')"></div>
                            <div class="p-8">
                                <div class="flex justify-between items-start">
                                    <div><p class="text-[10px] font-black text-emerald-600 uppercase tracking-widest mb-1">${d.categoria}</p><h3 class="text-2xl font-black text-slate-800">${d.id}</h3></div>
                                    <div class="text-right"><p class="text-[10px] font-bold text-slate-300 uppercase">Municipio</p><p class="text-xs font-black text-slate-500">${d.municipio}</p></div>
                                </div>
                                <div class="mt-8 pt-6 border-t border-slate-50 flex justify-between items-center font-bold text-[10px] text-slate-400">
                                    <span>🌡️ ${d.clima}</span><span>⛰️ ${d.dificultad}</span>
                                </div>
                            </div>
                        </div>`).join('')}
                    </div>
                </div>`;
        }
        else if(view==='municipios') {
            if(!user) return requireAuth();
            const res = await fetch(`${API}/admin/dashboard`);
            const data = await res.json();
            container.innerHTML = `
                <div class="px-10 py-16 max-w-7xl mx-auto">
                    <h2 class="text-4xl font-black mb-12 tracking-tighter italic">Salud de la Ontología</h2>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
                        <div class="bg-emerald-900 p-10 rounded-[3rem] text-white shadow-2xl">
                            <p class="text-xs font-bold opacity-50 uppercase tracking-widest mb-4">Conocimiento Total</p>
                            <h4 class="text-6xl font-black tracking-tighter">${data.total_tripletas} <span class="text-xl opacity-50">Tripletas</span></h4>
                        </div>
                    </div>
                </div>`;
        }
        else if(view==='gestion') {
            if(!user || user.role!=='admin') return requireAuth();
            container.innerHTML = `
                <div class="px-10 py-16 max-w-2xl mx-auto">
                    <h2 class="text-4xl font-black mb-8 tracking-tighter italic text-center">Nuevo Registro Semántico</h2>
                    <div class="bg-white p-12 rounded-[3.5rem] shadow-2xl space-y-8">
                        <div><label class="text-[10px] font-bold text-slate-400 uppercase ml-4">Nombre del Sitio</label><input id="lName" class="w-full p-5 bg-slate-50 border-none rounded-2xl mt-2 outline-none focus:ring-2 focus:ring-emerald-500"></div>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="text-[10px] font-bold text-slate-400 uppercase ml-4">Municipio</label><select id="lMun" class="w-full p-5 bg-slate-50 border-none rounded-2xl mt-2 outline-none"><option value="Florencia">Florencia</option><option value="Morelia">Morelia</option><option value="ElDoncello">El Doncello</option></select></div>
                            <div><label class="text-[10px] font-bold text-slate-400 uppercase ml-4">Categoría</label><select id="lCat" class="w-full p-5 bg-slate-50 border-none rounded-2xl mt-2 outline-none"><option value="Cascada">Cascada</option><option value="Alojamiento">Alojamiento</option><option value="CaminataEcologica">Caminata Ecológica</option></select></div>
                        </div>
                        <div><label class="text-[10px] font-bold text-slate-400 uppercase ml-4">URL Imagen</label><input id="lImg" class="w-full p-5 bg-slate-50 border-none rounded-2xl mt-2 outline-none"></div>
                        <button onclick="saveLugar()" class="w-full py-6 bg-emerald-950 text-white font-black rounded-3xl shadow-2xl hover:scale-105 transition-all uppercase tracking-widest">Sincronizar con RDF Nube</button>
                    </div>
                </div>`;
        }
    }

    function requireAuth() { if(!user) { toggleLogin(true); alert("🔐 Área exclusiva para exploradores registrados."); } }
    
    async function saveLugar() {
        const body = { id: document.getElementById('lName').value, categoria: document.getElementById('lCat').value, municipio: document.getElementById('lMun').value, imagen: document.getElementById('lImg').value || "https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&q=80&w=400" };
        const res = await fetch(`${API}/actividades`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
        if(res.ok) { alert("¡Sincronizado!"); showView('explorar'); }
    }

    function toggleChat() { if(!user) return requireAuth(); const w = document.getElementById('chatWidget'); w.classList.toggle('hidden'); w.classList.toggle('flex'); }
    async function sendChat() {
        const input = document.getElementById('chatIn'); if(!input.value) return;
        const msgs = document.getElementById('chatMsgs'); msgs.innerHTML += `<div class="flex justify-end"><div class="bg-emerald-950 text-white p-5 rounded-[2rem] rounded-tr-none text-sm shadow-xl">${input.value}</div></div>`;
        const res = await fetch(`${API}/chat`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({message: input.value, email: user.email}) });
        const data = await res.json();
        input.value = ''; msgs.innerHTML += `<div class="flex justify-start animate-fade-in"><div class="bg-white p-5 rounded-[2rem] rounded-tl-none text-sm border border-slate-100 shadow-xl"><b>IA:</b> ${data.reply}</div></div>`;
        msgs.scrollTop = msgs.scrollHeight;
    }
</script>
</body>
</html>
