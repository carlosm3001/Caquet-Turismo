<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caquetá Turismo V2.0 - Plataforma Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .sidebar-item-active { background: rgba(255,255,255,0.1); border-left: 4px solid #4ade80; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .gradient-green { background: linear-gradient(135deg, #064e3b 0%, #065f46 100%); }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 flex h-screen overflow-hidden">

<div id="loginOverlay" class="fixed inset-0 z-[2000] gradient-green flex items-center justify-center p-6">
    <div class="bg-white rounded-[2.5rem] p-10 w-full max-w-md shadow-2xl text-center">
        <div class="mb-8"><h2 class="text-3xl font-bold text-emerald-900 mb-2">Bienvenido V2.0</h2><p class="text-slate-500">Accede al portal dinámico de turismo</p></div>
        <div id="loginForm" class="space-y-4">
            <input type="email" id="email" placeholder="Admin Email" value="admin@gmail.com" class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-2 focus:ring-emerald-500 outline-none">
            <input type="password" id="pass" placeholder="Password" value="admin" class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:ring-2 focus:ring-emerald-500 outline-none">
            <button onclick="auth('login')" class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl shadow-lg transition-all">INGRESAR</button>
            <div class="relative flex py-3 items-center"><div class="flex-grow border-t border-slate-200"></div><span class="mx-4 text-slate-400 text-xs font-bold">O</span><div class="flex-grow border-t border-slate-200"></div></div>
            <button onclick="loginWithGoogle()" class="w-full py-4 bg-white border border-slate-200 text-slate-600 font-bold rounded-2xl flex items-center justify-center gap-3"><img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" class="w-5 h-5"> Google Login</button>
        </div>
    </div>
</div>

<nav class="w-72 gradient-green text-white flex flex-col h-full shadow-2xl z-50">
    <div class="p-8 border-b border-emerald-800/50 mb-6 text-center">
        <div id="userAvatar" class="w-16 h-16 rounded-2xl bg-white/20 mx-auto mb-4 flex items-center justify-center text-2xl font-black">?</div>
        <h1 class="text-xl font-black">CAQUETÁ <span class="text-emerald-400">V2</span></h1>
        <div id="roleBadge" class="mt-2 text-[10px] font-bold bg-emerald-400/20 text-emerald-400 px-2 py-1 rounded-md uppercase">INVITADO</div>
    </div>
    <div id="sideNav" class="flex-1 px-4 space-y-2"></div>
    <div class="p-8 border-t border-emerald-800/50"><button onclick="logout()" class="w-full py-3 bg-white/5 hover:bg-white/10 rounded-xl text-sm transition-all"><i class="fas fa-sign-out-alt mr-2"></i> Salir</button></div>
</nav>

<main class="flex-1 flex flex-col overflow-hidden relative">
    <header class="h-24 glass border-b border-slate-100 flex items-center justify-between px-10 z-40">
        <div><h2 id="welcomeMsg" class="text-xl font-bold text-emerald-900">Hola</h2><p class="text-[10px] text-slate-400 font-bold uppercase">Arquitectura CRUD Semántica en Tiempo Real</p></div>
        <div id="headerAvatar" class="w-12 h-12 rounded-2xl gradient-green flex items-center justify-center text-white font-bold">?</div>
    </header>
    <div id="mainContainer" class="flex-1 overflow-y-auto p-10 space-y-8 bg-[url('https://www.transparenttextures.com/patterns/leaf.png')]"></div>
</main>

<div id="chatWidget" class="fixed bottom-32 right-8 w-96 h-[500px] bg-white rounded-[2.5rem] shadow-2xl border border-slate-100 hidden flex-col overflow-hidden z-[1000]">
    <div class="p-6 bg-emerald-600 text-white flex justify-between">
        <div class="flex items-center gap-3"><i class="fas fa-robot"></i><h4 class="font-bold">Guía Caquetá V2</h4></div>
        <button onclick="toggleChat()"><i class="fas fa-times"></i></button>
    </div>
    <div id="chatMsgs" class="flex-1 p-6 overflow-y-auto space-y-4 bg-slate-50"></div>
    <div class="p-6 bg-white border-t flex gap-3">
        <input type="text" id="chatIn" placeholder="Escribe..." class="flex-1 px-4 py-3 bg-slate-100 rounded-xl outline-none">
        <button onclick="sendChat()" class="p-3 bg-emerald-600 text-white rounded-xl"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>
<button id="chatBtn" onclick="toggleChat()" class="fixed bottom-8 right-8 w-16 h-16 gradient-green text-white rounded-2xl shadow-xl hidden items-center justify-center text-2xl z-[1000] hover:scale-110 transition-all"><i class="fas fa-comment-dots"></i></button>

<script>
    const API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? "http://localhost:8001/api/v1" : "/api/v1";
    let user = null;

    function initSession() {
        document.getElementById('loginOverlay').classList.add('hidden');
        document.getElementById('welcomeMsg').innerText = `Hola, ${user.name}`;
        document.getElementById('roleBadge').innerText = user.role.toUpperCase();
        document.getElementById('userAvatar').innerText = user.name.charAt(0);
        document.getElementById('headerAvatar').innerText = user.name.charAt(0);
        document.getElementById('chatBtn').style.display = 'flex';
        renderMenu(); showView('inicio');
    }

    function checkUrlToken() {
        const token = new URLSearchParams(window.location.search).get('token') || localStorage.getItem('access_token');
        if (token) {
            localStorage.setItem('access_token', token);
            window.history.replaceState({}, "", "/");
            const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
            user = payload; user.token = token; initSession();
        }
    }
    window.onload = checkUrlToken;

    async function auth(type) {
        const body = { email: document.getElementById('email').value, password: document.getElementById('pass').value };
        const res = await fetch(`${API}/${type}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
        if(res.ok) { const data = await res.json(); localStorage.setItem('access_token', data.token); user = data; initSession(); } else alert("Fallo");
    }

    function loginWithGoogle() { window.location.href = `${API}/auth/google`; }
    function logout() { localStorage.removeItem('access_token'); location.reload(); }

    function renderMenu() {
        const items = [{id:'inicio',label:'Inicio',icon:'home'},{id:'explorar',label:'Catálogo',icon:'compass'},{id:'municipios',label:'Dashboard',icon:'chart-pie'}];
        if(user.role==='admin' || user.role==='lugar') items.push({id:'gestion',label:'Nuevo Sitio',icon:'plus-circle'});
        document.getElementById('sideNav').innerHTML = items.map(i => `<div class="p-4 rounded-2xl flex items-center gap-4 text-emerald-100 hover:text-white hover:bg-white/5 cursor-pointer transition-all" onclick="showView('${i.id}', this)"><i class="fas fa-${i.icon} w-5"></i><span class="text-sm font-medium">${i.label}</span></div>`).join('');
    }

    async function showView(view, el) {
        const container = document.getElementById('mainContainer');
        container.innerHTML = '<div class="flex justify-center py-20"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-600"></div></div>';
        if(view==='inicio') container.innerHTML = '<div class="bg-emerald-900 rounded-[3rem] p-16 text-white relative overflow-hidden"><h1 class="text-5xl font-black mb-6">Arquitectura V2.0</h1><p class="text-lg opacity-80 mb-10">Ontología dinámica con persistencia en tiempo real.</p><button onclick="showView(\'explorar\')" class="bg-white text-emerald-900 px-8 py-4 rounded-2xl font-bold">Explorar Ahora</button></div>';
        else if(view==='explorar') {
            const res = await fetch(`${API}/actividades`);
            const data = await res.json();
            container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">${data.map(d => `
                <div class="bg-white rounded-[2rem] overflow-hidden shadow-xl border border-slate-50 group hover:-translate-y-2 transition-all">
                    <div class="h-48 bg-cover bg-center" style="background-image: url('${d.imagen}')"></div>
                    <div class="p-8">
                        <span class="text-[10px] font-bold text-blue-600 uppercase tracking-widest">${d.categoria}</span>
                        <h3 class="text-xl font-bold mt-2">${d.id}</h3>
                        <p class="text-slate-400 text-sm mb-4"><i class="fas fa-map-marker-alt text-emerald-500"></i> ${d.municipio}</p>
                        <div class="flex justify-between text-xs font-bold text-slate-500"><span>🌡️ ${d.clima}</span><span>⛰️ ${d.dificultad}</span></div>
                    </div>
                </div>`).join('')}</div>`;
        }
        else if(view==='municipios') {
            const res = await fetch(`${API}/admin/dashboard`);
            const data = await res.json();
            container.innerHTML = `<h2 class="text-3xl font-black mb-8">Estado de la Ontología</h2><div class="grid grid-cols-4 gap-6"><div class="bg-emerald-600 p-8 rounded-3xl text-white shadow-xl"><p class="text-xs uppercase font-bold opacity-80">Tripletas Totales</p><h4 class="text-4xl font-black mt-2">${data.total_tripletas}</h4></div><div class="bg-white p-8 rounded-3xl shadow-lg border border-slate-50"><p class="text-xs uppercase font-bold text-slate-400">Municipios</p><h4 class="text-4xl font-black mt-2">${Object.keys(data.municipios).length}</h4></div></div>`;
        }
        else if(view==='gestion') {
            container.innerHTML = `
                <h2 class="text-3xl font-black mb-6 italic">Agregar Recurso Semántico</h2>
                <div class="bg-white p-10 rounded-[3rem] shadow-xl max-w-xl space-y-6 border border-slate-50">
                    <div><label class="text-xs font-bold text-slate-400 uppercase">Nombre del Sitio</label><input id="lName" class="w-full p-4 bg-slate-50 border rounded-2xl"></div>
                    <div><label class="text-xs font-bold text-slate-400 uppercase">Municipio</label><select id="lMun" class="w-full p-4 bg-slate-50 border rounded-2xl"><option value="Florencia">Florencia</option><option value="Morelia">Morelia</option><option value="ElDoncello">El Doncello</option></select></div>
                    <div><label class="text-xs font-bold text-slate-400 uppercase">Categoría Semántica</label><select id="lCat" class="w-full p-4 bg-slate-50 border rounded-2xl"><option value="Cascada">Cascada</option><option value="Alojamiento">Alojamiento</option><option value="CaminataEcologica">Caminata Ecológica</option></select></div>
                    <div><label class="text-xs font-bold text-slate-400 uppercase">URL Imagen (Opcional)</label><input id="lImg" placeholder="https://..." class="w-full p-4 bg-slate-50 border rounded-2xl"></div>
                    <button onclick="saveLugar()" class="w-full py-5 gradient-green text-white font-black rounded-2xl shadow-xl transition-all">GUARDAR EN RDF NUBE</button>
                </div>`;
        }
    }

    async function saveLugar() {
        const body = { id: document.getElementById('lName').value, categoria: document.getElementById('lCat').value, municipio: document.getElementById('lMun').value, imagen: document.getElementById('lImg').value || "https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&q=80&w=400" };
        const res = await fetch(`${API}/actividades`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
        if(res.ok) { alert("¡Éxito! Ontología actualizada."); showView('explorar'); } else alert("Error");
    }

    function toggleChat() { const w = document.getElementById('chatWidget'); w.classList.toggle('hidden'); w.classList.toggle('flex'); }
    async function sendChat() {
        const input = document.getElementById('chatIn'); if(!input.value) return;
        const msgs = document.getElementById('chatMsgs'); msgs.innerHTML += `<div class="flex justify-end"><div class="bg-emerald-600 text-white p-4 rounded-2xl rounded-tr-none text-sm">${input.value}</div></div>`;
        const res = await fetch(`${API}/chat`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({message: input.value, email: user.email}) });
        const data = await res.json();
        input.value = ''; msgs.innerHTML += `<div class="flex justify-start"><div class="bg-white p-4 rounded-2xl rounded-tl-none text-sm border border-slate-100 shadow-sm"><b>IA:</b> ${data.reply}</div></div>`;
        msgs.scrollTop = msgs.scrollHeight;
    }
</script>
</body>
</html>
