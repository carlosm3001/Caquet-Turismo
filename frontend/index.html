<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caquetá Turismo - Plataforma Inteligente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .sidebar-item-active { background: rgba(255,255,255,0.1); border-left: 4px solid #4ade80; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .gradient-green { background: linear-gradient(135deg, #064e3b 0%, #065f46 100%); }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 flex h-screen overflow-hidden">

<!-- LOGIN OVERLAY -->
<div id="loginOverlay" class="fixed inset-0 z-[2000] gradient-green flex items-center justify-center p-6">
    <div class="bg-white rounded-[2.5rem] p-10 w-full max-w-md shadow-2xl text-center">
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-emerald-900 mb-2">Bienvenido</h2>
            <p class="text-slate-500">Accede al portal de turismo del Caquetá</p>
        </div>
        
        <div id="loginForm" class="space-y-4">
            <input type="email" id="email" placeholder="Correo electrónico" value="admin@gmail.com" class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
            <input type="password" id="pass" placeholder="Contraseña" value="admin" class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all">
            <button onclick="auth('login')" class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl shadow-lg shadow-emerald-100 transition-all active:scale-[0.98]">INGRESAR</button>
            
            <div class="relative flex py-3 items-center">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink mx-4 text-slate-400 text-xs uppercase font-bold">O también</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <button onclick="loginWithGoogle()" class="w-full py-4 bg-white border border-slate-200 text-slate-600 font-bold rounded-2xl shadow-sm hover:bg-slate-50 transition-all flex items-center justify-center gap-3">
                <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" class="w-5 h-5"> Iniciar con Google
            </button>

            <p class="mt-6 text-sm">¿No tienes cuenta? <span onclick="toggleAuth(true)" class="text-emerald-600 font-bold cursor-pointer">Regístrate aquí</span></p>
        </div>

        <div id="registerForm" class="hidden space-y-4">
            <input type="text" id="regName" placeholder="Nombre completo" class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:outline-none">
            <input type="email" id="regEmail" placeholder="Correo electrónico" class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:outline-none">
            <input type="password" id="regPass" placeholder="Contraseña" class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:outline-none">
            <select id="regRole" class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:outline-none">
                <option value="turista">Turista</option>
                <option value="lugar">Propietario</option>
            </select>
            <button onclick="auth('register')" class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl transition-all">REGISTRARSE</button>
            <button onclick="loginWithGoogle()" class="w-full py-4 bg-white border border-slate-200 text-slate-600 font-bold rounded-2xl shadow-sm hover:bg-slate-50 transition-all flex items-center justify-center gap-3 mt-3">
                <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" class="w-5 h-5"> Registrar con Google
            </button>
            <p class="mt-6 text-sm">¿Ya tienes cuenta? <span onclick="toggleAuth(false)" class="text-emerald-600 font-bold cursor-pointer">Inicia sesión</span></p>
        </div>
    </div>
</div>

<!-- SIDEBAR -->
<nav class="w-72 gradient-green text-white flex flex-col h-full shadow-2xl z-50">
    <div class="p-8 border-b border-emerald-800/50 mb-6 text-center">
        <div id="userAvatar" class="w-16 h-16 rounded-2xl bg-white/20 mx-auto mb-4 flex items-center justify-center text-2xl font-black">?</div>
        <h1 class="text-xl font-black tracking-tighter">CAQUETÁ <span class="text-emerald-400">WEB</span></h1>
        <div id="roleBadge" class="mt-2 text-[10px] font-bold bg-emerald-400/20 text-emerald-400 px-2 py-1 rounded-md inline-block tracking-widest uppercase italic">INVITADO</div>
    </div>
    
    <div id="sideNav" class="flex-1 px-4 space-y-2"></div>

    <div class="p-8 border-t border-emerald-800/50">
        <button onclick="logout()" class="w-full py-3 bg-white/5 hover:bg-white/10 rounded-xl text-sm font-semibold transition-all">
            <i class="fas fa-sign-out-alt mr-2"></i> Cerrar Sesión
        </button>
    </div>
</nav>

<main class="flex-1 flex flex-col overflow-hidden relative">
    <header class="h-24 glass border-b border-slate-100 flex items-center justify-between px-10 z-40">
        <div>
            <h2 id="welcomeMsg" class="text-xl font-bold text-emerald-900 italic">Bienvenido</h2>
            <p class="text-[10px] text-slate-400 font-bold tracking-widest uppercase">Motor Semántico • Protégé DB</p>
        </div>
        <div class="flex items-center gap-6">
            <a href="http://localhost:8001/docs" target="_blank" class="flex items-center gap-2 text-emerald-600 font-bold text-[10px] tracking-tighter bg-emerald-50 px-4 py-2 rounded-xl border border-emerald-100 uppercase">
                <i class="fas fa-file-code"></i> SWAGGER DOCS
            </a>
            <div id="headerAvatar" class="w-12 h-12 rounded-2xl gradient-green flex items-center justify-center text-white font-bold shadow-lg shadow-emerald-100">?</div>
        </div>
    </header>

    <div id="mainContainer" class="flex-1 overflow-y-auto p-10 space-y-8 bg-[url('https://www.transparenttextures.com/patterns/leaf.png')]"></div>
</main>

<!-- CHAT IA -->
<div id="chatWidget" class="fixed bottom-32 right-8 w-96 h-[500px] bg-white rounded-[2.5rem] shadow-2xl border border-slate-100 hidden flex-col overflow-hidden z-[1000]">
    <div class="p-6 bg-emerald-600 text-white flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center"><i class="fas fa-robot"></i></div>
            <div>
                <h4 class="font-bold">Amazonia-IA</h4>
                <p class="text-[10px] opacity-80 uppercase font-bold tracking-widest">Semantic Core</p>
            </div>
        </div>
        <button onclick="toggleChat()" class="text-white/60 hover:text-white"><i class="fas fa-times"></i></button>
    </div>
    <div id="chatMsgs" class="flex-1 p-6 overflow-y-auto space-y-4 bg-slate-50"></div>
    <div class="p-6 bg-white border-t border-slate-100 flex gap-3">
        <input type="text" id="chatIn" placeholder="Pregunta sobre la ontología..." class="flex-1 px-4 py-3 bg-slate-100 rounded-xl focus:outline-none">
        <button onclick="sendChat()" class="p-3 bg-emerald-600 text-white rounded-xl shadow-lg shadow-emerald-100"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<button id="chatBtn" onclick="toggleChat()" class="fixed bottom-8 right-8 w-16 h-16 gradient-green text-white rounded-2xl shadow-xl shadow-emerald-200 hidden items-center justify-center text-2xl z-[1000] hover:scale-110 transition-all">
    <i class="fas fa-comment-dots"></i>
</button>

<script>
    const API = "http://localhost:8001/api/v1";
    let user = null;

    // --- NUEVA LÓGICA DE POPUP (SOLUCIÓN DEFINITIVA) ---
    function loginWithGoogle() {
        const width = 500, height = 600;
        const left = (window.innerWidth / 2) - (width / 2);
        const top = (window.innerHeight / 2) - (height / 2);
        window.open(`${API}/auth/google`, "GoogleLogin", `width=${width},height=${height},top=${top},left=${left}`);
    }

    window.addEventListener('message', (event) => {
        if (event.origin !== "http://localhost:8001") return;
        if (event.data.type === 'GOOGLE_AUTH_SUCCESS') {
            const token = event.data.token;
            localStorage.setItem('access_token', token);
            processToken(token);
        }
    });

    function checkUrlToken() {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        if (token) {
            localStorage.setItem('access_token', token);
            window.history.replaceState({}, document.title, window.location.pathname);
            processToken(token);
        } else {
            const savedToken = localStorage.getItem('access_token');
            if (savedToken) processToken(savedToken);
        }
    }

    function processToken(token) {
        try {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const payload = JSON.parse(atob(base64));
            user = payload; user.token = token;
            initSession();
        } catch (e) { logout(); }
    }

    function initSession() {
        document.getElementById('loginOverlay').classList.add('hidden');
        document.getElementById('welcomeMsg').innerText = `Hola, ${user.name}`;
        document.getElementById('roleBadge').innerText = user.role.toUpperCase();
        document.getElementById('userAvatar').innerText = user.name.charAt(0);
        document.getElementById('headerAvatar').innerText = user.name.charAt(0);
        document.getElementById('chatBtn').style.display = 'flex';
        renderMenu(); showView('inicio');
    }

    function logout() { localStorage.removeItem('access_token'); location.reload(); }
    window.onload = checkUrlToken;

    function toggleAuth(show) { document.getElementById('loginForm').classList.toggle('hidden', show); document.getElementById('registerForm').classList.toggle('hidden', !show); }

    async function auth(type) {
        const body = type === 'login' ? { email: document.getElementById('email').value, password: document.getElementById('pass').value } : { email: document.getElementById('regEmail').value, password: document.getElementById('regPass').value, name: document.getElementById('regName').value, role: document.getElementById('regRole').value };
        const res = await fetch(`${API}/${type}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
        const data = await res.json();
        if(!res.ok) return alert("Error");
        if(type === 'login') { localStorage.setItem('access_token', data.token); user = data; initSession(); }
        else { alert("Registrado"); toggleAuth(false); }
    }

    function renderMenu() {
        const nav = document.getElementById('sideNav');
        const items = [{ id: 'inicio', label: 'Inicio', icon: 'home' }, { id: 'explorar', label: 'Lugares', icon: 'compass' }, { id: 'municipios', label: 'Estadísticas', icon: 'chart-pie' }];
        if(user.role === 'admin' || user.role === 'lugar') items.push({ id: 'gestion', label: 'Nueva Entrada', icon: 'plus-circle' });
        if(user.role === 'admin') { items.push({ id: 'usuarios', label: 'Usuarios', icon: 'users' }); items.push({ id: 'portal_api', label: 'Portal API', icon: 'code' }); }
        nav.innerHTML = items.map(i => `<div class="nav-item group cursor-pointer p-4 rounded-2xl flex items-center gap-4 text-emerald-100 hover:text-white hover:bg-white/5 transition-all ${i.id==='inicio'?'sidebar-item-active text-white bg-white/10':''}" onclick="showView('${i.id}', this)"><i class="fas fa-${i.icon} w-5 text-center"></i><span class="font-medium text-sm">${i.label}</span></div>`).join('');
    }

    async function showView(view, el) {
        if(el) { document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('sidebar-item-active', 'bg-white/10', 'text-white')); el.classList.add('sidebar-item-active', 'bg-white/10', 'text-white'); }
        const container = document.getElementById('mainContainer');
        container.innerHTML = `<div class="flex items-center justify-center py-20"><div class="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-600"></div></div>`;
        if(view === 'inicio') { container.innerHTML = `<div class="space-y-6"><div class="bg-emerald-900 rounded-[3rem] p-16 text-white relative overflow-hidden shadow-2xl shadow-emerald-100"><div class="relative z-10 max-w-2xl"><h1 class="text-5xl font-black mb-6">Tu aventura comienza con el conocimiento.</h1><p class="text-emerald-100 text-lg mb-10 opacity-80">Conectando el Caquetá con la base de datos de Protégé.</p><button onclick="showView('explorar')" class="bg-white text-emerald-900 px-8 py-4 rounded-2xl font-bold hover:scale-105 transition-all shadow-xl shadow-emerald-950/20">Explorar Destinos</button></div><i class="fas fa-leaf absolute -bottom-10 -right-10 text-[20rem] text-emerald-800 opacity-20 rotate-12"></i></div></div>`; }
        else if(view === 'explorar') {
            const res = await fetch(`${API}/actividades`);
            const data = await res.json();
            container.innerHTML = `<div class="flex justify-between items-center mb-10"><h2 class="text-3xl font-black text-slate-800">Catálogo Inteligente</h2><span class="bg-emerald-100 text-emerald-700 px-4 py-2 rounded-full font-bold text-xs uppercase tracking-widest">${data.length} Sitios en RDF</span></div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">${data.map(d => `<div class="bg-white rounded-[2rem] overflow-hidden shadow-xl shadow-slate-200/50 border border-slate-50 group hover:-translate-y-2 transition-all duration-300"><div class="h-48 gradient-green relative flex items-center justify-center text-white overflow-hidden"><i class="fas fa-mountain text-8xl opacity-10 absolute rotate-12"></i><span class="text-4xl font-black">${d.id.charAt(0)}</span></div><div class="p-8"><span class="bg-blue-50 text-blue-600 px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider mb-3 inline-block">${d.categoria}</span><h3 class="text-xl font-bold text-slate-800 mb-2">${d.id}</h3><p class="text-slate-400 text-sm mb-6 flex items-center gap-2"><i class="fas fa-map-marker-alt text-emerald-500"></i> ${d.municipio}</p><button class="w-full py-4 bg-slate-50 hover:bg-emerald-50 text-slate-600 hover:text-emerald-600 font-bold rounded-2xl border border-slate-100 hover:border-emerald-200 transition-all">Ver Detalles</button></div></div>`).join('')}</div>`;
        }
        else if(view === 'municipios') {
            const res = await fetch(`${API}/admin/dashboard`);
            const data = await res.json();
            container.innerHTML = `<h2 class="text-3xl font-black text-slate-800 mb-10">Distribución Geográfica</h2><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">${Object.entries(data.municipios).map(([m, c]) => `<div class="bg-white p-8 rounded-[2rem] shadow-lg border border-slate-50 text-center"><div class="w-16 h-16 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto mb-6 text-2xl font-bold">${c}</div><h4 class="font-bold text-slate-800">${m}</h4><p class="text-slate-400 text-xs mt-1 uppercase tracking-widest">Sitios Turísticos</p></div>`).join('')}</div>`;
        }
        else if(view === 'gestion') { container.innerHTML = `<h2 class="text-3xl font-black text-slate-800 mb-6">Actualizar Ontología</h2><div class="bg-white p-12 rounded-[3rem] shadow-xl border border-slate-50 max-w-2xl"><div class="space-y-6"><div><label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Nombre del sitio</label><input id="lName" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl"></div><div><label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Municipio</label><input id="lMun" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl"></div><button onclick="saveLugar()" class="w-full py-5 gradient-green text-white font-black rounded-2xl shadow-xl">GUARDAR EN RDF</button></div></div>`; }
        else if(view === 'usuarios') {
            const res = await fetch(`${API}/admin/users`);
            const data = await res.json();
            container.innerHTML = `<h2 class="text-3xl font-black text-slate-800 mb-10">Auditoría</h2><div class="bg-white rounded-[2.5rem] shadow-xl border border-slate-50 overflow-hidden"><table class="w-full text-left"><thead><tr class="bg-slate-50"><th class="p-8">Nombre</th><th class="p-8">Email</th><th class="p-8">Rol</th></tr></thead><tbody>${data.map(u => `<tr class="border-b border-slate-50"><td class="p-8 font-bold">${u.name}</td><td class="p-8">${u.email}</td><td class="p-8">${u.role}</td></tr>`).join('')}</tbody></table></div>`;
        }
        else if(view === 'portal_api') { container.innerHTML = `<h2 class="text-3xl font-black text-slate-800 mb-10">Portal API</h2><button onclick="tryApi('/admin/ontology/full', this.nextElementSibling)" class="px-8 py-4 bg-emerald-600 text-white font-bold rounded-2xl">EJECUTAR TEST</button><div class="mt-8"></div>`; }
    }

    async function saveLugar() { const body = { id: document.getElementById('lName').value, categoria: "Cascada", municipio: document.getElementById('lMun').value }; await fetch(`${API}/actividades`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) }); alert("Guardado"); showView('explorar'); }
    async function tryApi(path, div) { div.innerHTML = "Consultando..."; const res = await fetch(`${API}${path}`); const data = await res.json(); div.innerHTML = `<pre class="p-8 bg-slate-900 rounded-[2rem] text-emerald-400 text-xs">${JSON.stringify(data, null, 2)}</pre>`; }
    function toggleChat() { const w = document.getElementById('chatWidget'); w.classList.toggle('hidden'); w.classList.toggle('flex'); }
    async function sendChat() {
        const input = document.getElementById('chatIn'); if(!input.value) return;
        const msgs = document.getElementById('chatMsgs'); msgs.innerHTML += `<div class="flex justify-end"><div class="bg-emerald-600 text-white p-4 rounded-2xl rounded-tr-none text-sm">${input.value}</div></div>`;
        const res = await fetch(`${API}/chat`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({message: input.value, email: user.email}) });
        const data = await res.json();
        input.value = ''; msgs.innerHTML += `<div class="flex justify-start"><div class="bg-white p-4 rounded-2xl rounded-tl-none text-sm border border-slate-100"><b>IA:</b> ${data.reply}</div></div>`;
        msgs.scrollTop = msgs.scrollHeight;
    }
</script>
</body>
</html>
